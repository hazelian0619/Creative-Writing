# Prometheus配置 - 认知状态追踪系统监控

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'cognitive-state-monitor'

# 告警规则配置
rule_files:
  - "alert_rules.yml"

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

# 抓取配置
scrape_configs:
  # Prometheus自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 认知状态后端API服务
  - job_name: 'cognitive-backend'
    static_configs:
      - targets: ['cognitive-backend:9090']
    scrape_interval: 10s
    metrics_path: '/metrics'
    scrape_timeout: 8s

  # MongoDB监控（如果启用了MongoDB Exporter）
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    scrape_interval: 30s

  # Redis监控（如果启用了Redis Exporter）
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # 系统节点监控（如果启用了Node Exporter）
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # 容器监控（如果启用了cAdvisor）
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

