# Team B - 认知状态后端服务 Docker Compose
# 包含完整的开发和测试环境

version: '3.8'

services:
  # 认知状态后端API服务
  cognitive-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cognitive-backend
    ports:
      - "8000:8000"    # API端口
      - "9090:9090"    # Prometheus指标端口
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=cognitive_state_db
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - API_RELOAD=false
      - API_WORKERS=4
    volumes:
      - ./team_a:/app/team_a:ro  # 挂载Team A的模型和特征提取器
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - cognitive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB数据库
  mongodb:
    image: mongo:6.0
    container_name: cognitive-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=cognitive_state_db
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - cognitive-network
    restart: unless-stopped
    command: mongod --auth

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: cognitive-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cognitive-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Prometheus监控
  prometheus:
    image: prom/prometheus:latest
    container_name: cognitive-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - cognitive-network
    restart: unless-stopped

  # Grafana仪表板
  grafana:
    image: grafana/grafana:latest
    container_name: cognitive-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - cognitive-network
    restart: unless-stopped

  # Nginx反向代理（生产环境）
  nginx:
    image: nginx:alpine
    container_name: cognitive-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/ssl:ro
    depends_on:
      - cognitive-backend
    networks:
      - cognitive-network
    restart: unless-stopped

  # 日志收集（可选）
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.8.0
    container_name: cognitive-filebeat
    user: root
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/app/logs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cognitive-network
    restart: unless-stopped

networks:
  cognitive-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mongodb_data:
  redis_data:
  prometheus_data:
  grafana_data: